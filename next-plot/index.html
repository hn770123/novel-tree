<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>並行の兄影 - セルフノベル続編</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ゲーム画面 -->
    <div id="game-container">
        <!-- 背景画像とキャラクター画像のコンテナ -->
        <div id="background">
            <!-- キャラクター画像 - 背景の上に重ねて表示 -->
            <div id="character"></div>
        </div>
        
        <!-- テキストボックス -->
        <div id="text-box">
            <div id="speaker-name"></div>
            <div id="text-content"></div>
            <div id="continue-indicator">▼</div>
        </div>
        
        <!-- 選択肢ボックス -->
        <div id="choice-box"></div>
        
        <!-- タイトル画面 -->
        <div id="title-screen">
            <h1>並行の兄影</h1>
            <p class="subtitle">〜目覚めの部屋 続編〜</p>
            <button id="start-button" class="menu-button">はじめる</button>
            <a href="../" class="menu-button prequel-link">前編へ</a>
            <div class="game-info">
                <p>推定プレイ時間：10〜15分</p>
                <p>すべての選択肢に正解・不正解はありません</p>
                <p>あなたの心のままに、お選びください</p>
            </div>
        </div>
        
        <!-- メニューボタン -->
        <div id="menu-buttons">
            <button id="back-button" class="menu-btn" title="一つ戻る">BACK</button>
            <button id="title-button" class="menu-btn" title="タイトルへ">TITLE</button>
        </div>
        
        <!-- エンディング画面 -->
        <div id="ending-screen" style="display: none;">
            <button id="ending-title-button" class="menu-button">タイトルに戻る</button>
            <a href="../" class="menu-button prequel-link">前編へ</a>
        </div>

    </div>
    
    <!-- ゲームエンジン -->
    <script src="game-engine.js"></script>
</body>
</html>
